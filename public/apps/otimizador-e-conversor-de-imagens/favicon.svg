<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0b0f19" stroke="#1e293b" stroke-width="12"/>
  
  <!-- Glass inner layer -->
  <rect x="64" y="64" width="384" height="384" rx="80" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.05)" stroke-width="6"/>

  <g filter="url(#glow)">
    <!-- Image Box -->
    <rect x="128" y="144" width="256" height="192" rx="24" fill="none" stroke="url(#neonCyan)" stroke-width="24" />
    <!-- Mountains -->
    <path d="M128 288l64-64 48 48 64-80 52 64" fill="none" stroke="url(#neonCyan)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sun -->
    <circle cx="312" cy="208" r="24" fill="url(#neonCyan)" />
    
    <!-- Compression / Optimization Arrows -->
    <!-- Bottom Arrow -->
    <path d="M256 368v80 M216 408l40 40 40-40" fill="none" stroke="url(#neonEmerald)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top Arrow -->
    <path d="M256 144v-80 M216 104l40-40 40 40" fill="none" stroke="url(#neonEmerald)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

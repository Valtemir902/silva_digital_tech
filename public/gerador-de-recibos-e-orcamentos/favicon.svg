<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="240" height="240" rx="50" fill="url(#bgGlow)" />
  <rect x="10" y="10" width="220" height="220" rx="40" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3" />
  
  <g filter="url(#neonGlow)">
    <path d="M70 50H140L170 80V190C170 195.523 165.523 200 160 200H70C64.4772 200 60 195.523 60 190V50C60 44.4772 64.4772 50 70 50Z" fill="none" stroke="url(#lineGlow)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M135 50V85H170" fill="none" stroke="url(#lineGlow)" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Barras de Gráfico Internas -->
    <path d="M90 150V110 M115 150V90 M140 150V120" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Tech Nodes Brancos -->
    <circle cx="90" cy="110" r="7" fill="#ffffff" />
    <circle cx="115" cy="90" r="7" fill="#ffffff" />
    <circle cx="140" cy="120" r="7" fill="#ffffff" />
  </g>
</svg>

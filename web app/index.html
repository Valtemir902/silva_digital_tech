<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags Dinâmicas (Essencial para Google) -->
    <title>Cotação de Café Arábica Hoje | Preço Atualizado em Tempo Real</title>
    <meta name="description" content="Acompanhe o preço atualizado da saca de café arábica. Cotação em tempo real, tendência de mercado e análise técnica para produtores.">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5388021156952745"crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Header Focado em Ação -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur-md sticky top-0">
        <h1 class="text-xl font-black text-emerald-500 uppercase italic tracking-tighter">Agro<span class="text-white">Price</span></h1>
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Live Market</span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        
        <!-- Bloco Principal - Focado na busca do usuário -->
        <section class="mt-8 mb-10">
            <h2 class="text-slate-400 text-sm mb-2 uppercase tracking-widest font-semibold">Preço do Café (Saca 60kg)</h2>
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl shadow-emerald-900/20">
                <div class="text-6xl font-black text-white">R$ 1.240,00</div>
                <div class="flex items-center gap-3 mt-4">
                    <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 font-bold rounded-full text-sm">▲ Alta 2.5%</span>
                    <span class="text-slate-500 text-sm">Atualizado: 15:50</span>
                </div>
            </div>
        </section>

        <!-- Espaço AdSense Estratégico -->
        <div class="w-full h-32 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-center text-slate-700 text-xs mb-10">
            [Espaço Publicitário - 300x250]
        </div>

        <!-- Seção de Tendência/IA -->
        <section>
            <h3 class="text-slate-300 font-bold mb-4">Análise de Tendência (IA)</h3>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <p class="text-slate-400 leading-relaxed italic">
                    "O cenário atual indica uma tendência de alta para as próximas 48 horas devido ao comportamento dos estoques globais..."
                </p>
            </div>
        </section>
    </main>

</body>
</html>
